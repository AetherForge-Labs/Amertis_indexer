type Account {
  id: ID!
  transactions: [Swap!]! @derivedFrom(field: "from")
  points: BigInt!
}

type Token {
  id: ID!
  name: String!
  symbol: String!
  decimals: BigInt!
}

type Swap {
  id: ID!
  from: String!
  _tokenIn: String!
  tokenInDetails: Token!
  _tokenOut: String!
  tokenOutDetails: Token!
  _amountIn: BigInt!
  _amountOut: BigInt!
  timeStamp: BigInt!
  value: BigInt!
  points: BigInt!
}

type GlobalData {
  id: ID!
  totalTx: BigInt!
  totalWallets: BigInt!
  totalVolume: BigInt!
}

type DailyData {
  id: ID!
  volume: BigInt!
  tx: BigInt!
}
